<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PageClone - Clonador de Páginas de Venda & Marketplace de Afiliados</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink: {
              950: '#07090c',
              900: '#0e121a',
              850: '#141a24',
              800: '#1c2433',
              700: '#283449'
            },
            marca: {
              400: '#a855f7',
              500: '#8b5cf6',
              600: '#7c3aed',
              accent: '#d946ef'
            },
            coral: {
              400: '#ff8a00',
              500: '#ff7700'
            },
            escuro: '#040507',
            fg: '#f3f4f6'
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #07090c;
      color: #f3f4f6;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
    }
    .glow-purple {
      box-shadow: 0 0 35px -5px rgba(139, 92, 246, 0.3);
    }
    .glow-coral {
      box-shadow: 0 0 35px -5px rgba(255, 138, 0, 0.3);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const Icons = {
      ArrowLeft: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>,
      Check: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" /></svg>,
      Copy: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>,
      Download: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
      ExternalLink: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>,
      Play: () => <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>,
      Mobile: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>,
      Desktop: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
      Sparkles: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
      Search: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
      Clone: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" /></svg>,
      ShieldCheck: () => <svg className="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
      Spinner: () => <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>,
      Bolt: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>,
      Store: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>,
      Folder: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>,
      Webhook: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>,
      Rocket: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>,
      Share: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 4v16m8-8H4" /></svg>,
      Trash: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      Eye: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
      Activity: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>,
      ShoppingCart: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
    };

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const initialRoute = urlParams.get('route') || 'clonador';
      const [currentRoute, setCurrentRoute] = useState(initialRoute);
      const [toastMessage, setToastMessage] = useState(null);
      const [products, setProducts] = useState([]);
      const [publishModalOpen, setPublishModalOpen] = useState(false);
      const [productToPublish, setProductToPublish] = useState(null);
      const [selectedCreativesModal, setSelectedCreativesModal] = useState(null);
      const [selectedWebhookModal, setSelectedWebhookModal] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Carregar produtos do marketplace
      const loadMarketplaceProducts = async () => {
        try {
          const res = await fetch('/api/marketplace');
          const data = await res.json();
          if (data.products) setProducts(data.products);
        } catch (e) {
          console.warn('Usando fallback do marketplace local');
        }
      };

      useEffect(() => {
        loadMarketplaceProducts();
      }, []);

      const handleOpenPublishModal = (data) => {
        setProductToPublish(data || {
          name: 'Papelaria Lucrativa - Caixa Cartonada do Zero',
          category: 'Artesanato & DIY',
          price: 37.00,
          commission: 26.00,
          commissionPercentage: 80,
          salesPageUrl: '/preview-clonada',
          creativeDriveUrl: 'https://drive.google.com/drive/folders/papelaria-lucrativa-criativos-alta-conversao',
          checkoutUrl: 'https://pay.kiwify.com.br/meu-checkout-afiliado-10k'
        });
        setPublishModalOpen(true);
      };

      return (
        <div className="min-h-screen bg-ink-950 text-fg flex flex-col custom-scrollbar">
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-gradient-to-r from-marca-500 to-marca-accent text-white px-5 py-3 rounded-2xl font-bold shadow-2xl flex items-center gap-2.5 animate-bounce border border-white/20">
              <Icons.Check />
              <span className="text-sm">{toastMessage}</span>
            </div>
          )}

          {/* HEADER PRINCIPAL PAGECLONE */}
          <header className="h-16 border-b border-white/8 bg-ink-900/90 backdrop-blur sticky top-0 z-40 px-6 flex items-center justify-between">
            <div className="flex items-center gap-4">
              <div 
                onClick={() => setCurrentRoute('clonador')}
                className="cursor-pointer flex items-center gap-3 select-none"
              >
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-marca-600 via-marca-500 to-coral-400 text-white flex items-center justify-center font-black text-base shadow-lg glow-purple">
                  PC
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-black text-lg tracking-tight bg-gradient-to-r from-white via-white to-white/70 bg-clip-text text-transparent">
                      PageClone
                    </span>
                    <span className="text-[10px] bg-marca-500/20 text-marca-400 border border-marca-500/30 px-2 py-0.5 rounded-full uppercase font-bold tracking-wider">
                      PRO v2.5
                    </span>
                  </div>
                  <div className="text-[10px] text-white/40 -mt-0.5 font-medium">
                    Clonador • Pixels & CAPI • Marketplace • Webhook
                  </div>
                </div>
              </div>
            </div>

            {/* NAVEGAÇÃO PRINCIPAL */}
            <nav className="flex items-center gap-1.5 bg-ink-850 p-1 rounded-2xl border border-white/5">
              <button 
                onClick={() => setCurrentRoute('clonador')}
                className={`px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${currentRoute === 'clonador' ? 'bg-marca-500 text-white shadow glow-purple' : 'text-white/60 hover:text-white'}`}
              >
                <Icons.Clone /> Clonador de Páginas
              </button>

              <button 
                onClick={() => { setCurrentRoute('marketplace'); loadMarketplaceProducts(); }}
                className={`px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${currentRoute === 'marketplace' ? 'bg-marca-500 text-white shadow glow-purple' : 'text-white/60 hover:text-white'}`}
              >
                <Icons.Store /> Marketplace
                {products.length > 0 && (
                  <span className="bg-coral-500 text-white text-[10px] font-black px-1.5 py-0.2 rounded-full">
                    {products.length}
                  </span>
                )}
              </button>

              <button 
                onClick={() => setCurrentRoute('webhooks')}
                className={`px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${currentRoute === 'webhooks' ? 'bg-marca-500 text-white shadow glow-purple' : 'text-white/60 hover:text-white'}`}
              >
                <Icons.Bolt /> Webhooks & Vendas
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              </button>
            </nav>
          </header>

          <main className="flex-1">
            {currentRoute === 'clonador' && (
              <ClonadorPaginaView 
                showToast={showToast} 
                onPublishToMarketplace={handleOpenPublishModal}
              />
            )}

            {currentRoute === 'marketplace' && (
              <MarketplaceView 
                products={products}
                onOpenPublishModal={handleOpenPublishModal}
                onSelectCreatives={(prod) => setSelectedCreativesModal(prod)}
                onSelectWebhook={(prod) => setSelectedWebhookModal(prod)}
                onCloneAgain={(prod) => {
                  setCurrentRoute('clonador');
                  showToast(`Página de "${prod.name}" pronta no Clonador!`);
                }}
                showToast={showToast}
                refreshMarketplace={loadMarketplaceProducts}
              />
            )}

            {currentRoute === 'webhooks' && (
              <WebhookLiveView showToast={showToast} />
            )}
          </main>

          {/* MODAL: PUBLICAR NO MARKETPLACE */}
          {publishModalOpen && (
            <PublicarMarketplaceModal 
              initialData={productToPublish}
              onClose={() => setPublishModalOpen(false)}
              onSuccess={() => {
                setPublishModalOpen(false);
                loadMarketplaceProducts();
                setCurrentRoute('marketplace');
                showToast('🚀 Produto publicado no Marketplace com Sucesso!');
              }}
            />
          )}

          {/* MODAL: MATERIAIS CRIATIVOS */}
          {selectedCreativesModal && (
            <CreativesModal 
              product={selectedCreativesModal}
              onClose={() => setSelectedCreativesModal(null)}
              showToast={showToast}
            />
          )}

          {/* MODAL: CONFIGURAÇÃO DE WEBHOOK */}
          {selectedWebhookModal && (
            <WebhookConfigModal 
              product={selectedWebhookModal}
              onClose={() => setSelectedWebhookModal(null)}
              showToast={showToast}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // VIEW 1: CLONADOR DE PÁGINAS COM PUBLICAÇÃO INTEGRADA
    // =========================================================================
    function ClonadorPaginaView({ showToast, onPublishToMarketplace }) {
      const [inputMode, setInputMode] = useState('url'); // 'url' ou 'html'
      const [targetUrl, setTargetUrl] = useState('https://fabricadelowtickets.com/preview-socios/produto/ingles-30dias');
      const [rawHtmlInput, setRawHtmlInput] = useState('');
      const [checkoutOffers, setCheckoutOffers] = useState([
        { id: 'off-1', label: 'Oferta 1 (Principal / Plano Completo)', url: 'https://pay.kiwify.com.br/6CMLXYq' },
        { id: 'off-2', label: 'Oferta 2 (Secundária / Downsell)', url: '' }
      ]);
      const [originalCheckout, setOriginalCheckout] = useState('');

      const [trackingTab, setTrackingTab] = useState('meta');
      const [pixelMeta, setPixelMeta] = useState('109823948572');
      const [metaCapiToken, setMetaCapiToken] = useState('');
      const [testCode, setTestCode] = useState('TEST9823');
      const [tiktokPixel, setTiktokPixel] = useState('C82K9D123ABCDEF');
      const [gtmId, setGtmId] = useState('GTM-ABCDEF1');
      const [ga4Id, setGa4Id] = useState('G-CLONE12345');
      const [googleAdsId, setGoogleAdsId] = useState('AW-987654321');
      const [googleAdsLabel, setGoogleAdsLabel] = useState('ABcDeFG_123');
      const [utmfyScript, setUtmfyScript] = useState('https://cdn.utmify.com.br/scripts/utms/latest.js');
      const [enableUtmForwarder, setEnableUtmForwarder] = useState(true);
      const [whatsappNumber, setWhatsappNumber] = useState('11999998888');
      const [backRedirectUrl, setBackRedirectUrl] = useState('');
      const [removeOriginalPixels, setRemoveOriginalPixels] = useState(true);

      const [isCloning, setIsCloning] = useState(false);
      const [statusMsg, setStatusMsg] = useState('');
      const [cloneError, setCloneError] = useState(null);
      const [previewHtml, setPreviewHtml] = useState(null);
      const [previewBlobUrl, setPreviewBlobUrl] = useState(null);
      const [clonedData, setClonedData] = useState({
        previewUrl: '/preview-clonada',
        detectedCheckouts: ['https://kiwify.app/ONNgjGo']
      });
      const [viewport, setViewport] = useState('desktop');

      useEffect(() => {
        // Pré-carrega o preview da página clonada imediatamente no carregamento inicial
        if (!previewHtml) {
          fetch('/preview-clonada')
            .then(res => res.text())
            .then(html => {
              if (html && html.length > 500 && !html.includes('Nenhuma página clonada ativa')) {
                setPreviewHtml(html);
                const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                setPreviewBlobUrl(URL.createObjectURL(blob));
              }
            })
            .catch(() => {});
        }
      }, []);

      const handleClonar = async () => {
        setCloneError(null);
        if (inputMode === 'url' && !targetUrl.trim()) {
          showToast('Digite a URL da página de vendas!');
          return;
        }
        if (inputMode === 'html' && !rawHtmlInput.trim()) {
          showToast('Cole o código HTML da página (Ctrl+U)!');
          return;
        }

        setIsCloning(true);
        setStatusMsg('Renderizando página, substituindo links e injetando pixels...');

        const validCheckouts = checkoutOffers.map(o => o.url.trim()).filter(Boolean);

        try {
          const response = await fetch('/api/clonar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              targetUrl: inputMode === 'url' ? targetUrl.trim() : 'https://pagina-clonada.local',
              rawHtml: inputMode === 'html' ? rawHtmlInput : null,
              newCheckout: validCheckouts[0] || '',
              newCheckouts: validCheckouts,
              originalCheckout: originalCheckout.trim(),
              pixelMeta: pixelMeta.trim(),
              metaCapiToken: metaCapiToken.trim(),
              testCode: testCode.trim(),
              tiktokPixel: tiktokPixel.trim(),
              gtmId: gtmId.trim(),
              ga4Id: ga4Id.trim(),
              googleAdsId: googleAdsId.trim(),
              googleAdsLabel: googleAdsLabel.trim(),
              utmfyScript: utmfyScript.trim(),
              enableUtmForwarder,
              whatsappNumber: whatsappNumber.trim(),
              backRedirectUrl: backRedirectUrl.trim(),
              removeOriginalPixels
            })
          });

          const data = await response.json();
          if (!response.ok || data.error) {
            throw new Error(data.error || 'Falha na resposta do servidor');
          }

          setClonedData(data);
          if (data.processedHtml) {
            setPreviewHtml(data.processedHtml);
            try {
              const blob = new Blob([data.processedHtml], { type: 'text/html;charset=utf-8' });
              setPreviewBlobUrl(URL.createObjectURL(blob));
            } catch(e){}
          }
          showToast('Página clonada com sucesso! Vídeo 9:16 responsivo e Pixels ativos.');
        } catch (err) {
          console.error('Erro na clonagem:', err);
          setCloneError(err.message);
          showToast(`Erro ao clonar: ${err.message}`);
        } finally {
          setIsCloning(false);
          setStatusMsg('');
        }
      };

      const handleDownloadHtml = () => {
        if (previewHtml) {
          const blob = new Blob([previewHtml], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'pagina-vendas-pageclone.html';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Download do HTML iniciado!');
        } else {
          window.open('/preview-clonada', '_blank');
        }
      };

      const handleOpenNewTab = () => {
        if (previewBlobUrl) {
          window.open(previewBlobUrl, '_blank');
        } else if (previewHtml) {
          const blob = new Blob([previewHtml], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          setPreviewBlobUrl(url);
          window.open(url, '_blank');
        } else {
          window.open('/preview-clonada', '_blank');
        }
      };

      return (
        <div className="max-w-[1520px] mx-auto px-6 py-8">
          {/* HEADER DA PÁGINA */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>

      const [logs, setLogs] = useState([]);
      const [isSimulating, setIsSimulating] = useState(false);

      const fetchLogs = async () => {
        try {
          const res = await fetch('/api/webhook');
          const data = await res.json();
          if (data.logs) setLogs(data.logs);
        } catch(e) {}
      };

      useEffect(() => {
        fetchLogs();
        const interval = setInterval(fetchLogs, 4000);
        return () => clearInterval(interval);
      }, []);

        setIsSimulating(true);

              isSimulation: true,
              platform: plataforma,
              order_status: 'paid',

              Commissions: { charge_amount: 26.00 },

              Customer: {
                full_name: 'Ana Carolina Meireles',
                email: 'anacarol***@gmail.com',
                mobile: '+55 11 98877-6655'

            })
          });
          const data = await res.json();
          if (data.success) {
            showToast(`⚡ Venda Aprovada recebida via ${plataforma} e CAPI disparado!`);

    function PublicarMarketplaceModal({ initialData, onClose, onSuccess }) {
      const [name, setName] = useState(initialData?.name || '');
      const [category, setCategory] = useState(initialData?.category || 'Artesanato & DIY');
      const [price, setPrice] = useState(initialData?.price || 37.00);
      const [commission, setCommission] = useState(initialData?.commission || 26.00);
      const [salesPageUrl, setSalesPageUrl] = useState(initialData?.salesPageUrl || '/preview-clonada');
      const [creativeDriveUrl, setCreativeDriveUrl] = useState(initialData?.creativeDriveUrl || 'https://drive.google.com/drive/folders/papelaria-lucrativa-criativos-alta-conversao');
      const [checkoutUrl, setCheckoutUrl] = useState(initialData?.checkoutUrl || 'https://pay.kiwify.com.br/meu-checkout-afiliado-10k');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        setIsSubmitting(true);
        try {
          const res = await fetch('/api/marketplace', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: name.trim(),
              category,
              price: parseFloat(price),
              commission: parseFloat(commission),
              commissionPercentage: Math.round((commission / price) * 100) || 75,
              image: '/video-poster.jpg',
              salesPageUrl: salesPageUrl.trim(),
              creativeDriveUrl: creativeDriveUrl.trim(),
              checkoutUrl: checkoutUrl.trim()
            })
          });

          const data = await res.json();
          if (data.success) {
            onSuccess();
          } else {
            alert(data.error || 'Erro ao publicar');
          }

          alert(e.message);

          setIsSubmitting(false);

      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-ink-900 border border-white/10 rounded-3xl max-w-xl w-full p-6 space-y-6 shadow-2xl relative">
            <div className="flex items-center justify-between border-b border-white/5 pb-4">
              <div className="flex items-center gap-2.5">
                <span className="p-2 rounded-xl bg-emerald-500/20 text-emerald-400">
                  <Icons.Webhook />
                </span>
                <div>
                  <h2 className="text-lg font-black text-white">Configuração do Webhook</h2>
                  <p className="text-xs text-white/50">{product.name}</p>
                </div>
              </div>
              <button onClick={onClose} className="text-white/40 hover:text-white text-sm font-bold">✕</button>
            </div>

            <div className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-white mb-1.5">Sua URL de Webhook Exclusiva (PageClone)</label>
                <div className="flex items-center gap-2">
                  <input 
                    type="text"
                    readOnly
                    value={webhookUrl}
                    className="w-full bg-ink-850 border border-emerald-500/40 rounded-xl px-3.5 py-2.5 text-xs text-emerald-400 font-mono focus:outline-none"
                  />
                  <button 
                    onClick={handleCopy}
                    className="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-escuro font-bold text-xs transition flex items-center gap-1.5 shrink-0"
                  >
                    {copied ? <Icons.Check /> : <Icons.Copy />} {copied ? 'Copiado!' : 'Copiar'}
                  </button>
                </div>
              </div>

              {/* INSTRUÇÕES KIWIFY / HOTMART */}
              <div className="p-4 rounded-2xl bg-ink-850 border border-white/5 text-xs space-y-2">
                <div className="font-bold text-white">Como conectar na Kiwify / Hotmart:</div>
                <ol className="list-decimal list-inside space-y-1 text-white/60 text-[11px] leading-relaxed">
                  <li>Acesse o painel do seu produto na <strong>Kiwify / Hotmart</strong>.</li>
                  <li>Vá em <strong>Apps & Integrações &gt; Webhooks</strong> e clique em <em>Criar Webhook</em>.</li>
                  <li>Cole a URL acima e selecione os eventos: <strong>Compra Aprovada</strong> e <strong>PIX Gerado</strong>.</li>
                  <li>Pronto! O PageClone receberá as vendas e notificará o Meta CAPI automaticamente.</li>
                </ol>
              </div>

              {/* BOTÃO DE TESTE */}
              <div className="p-4 rounded-2xl bg-white/5 border border-white/8 flex items-center justify-between">
                <div>
                  <div className="text-xs font-bold text-white">Testar Integração Agora</div>
                  <div className="text-[11px] text-white/50">Dispara um evento de teste de R$ {product.price}</div>
                </div>
                <button 
                  onClick={handleTestWebhook}
                  disabled={isTesting}
                  className="px-4 py-2 rounded-xl bg-marca-500 hover:bg-marca-600 text-white font-bold text-xs uppercase tracking-wider transition flex items-center gap-1.5 shadow"
                >
                  {isTesting ? <Icons.Spinner /> : <Icons.Bolt />} Simular Venda
                </button>
              </div>
            </div>

            <div className="text-right pt-2 border-t border-white/5">
              <button 
                onClick={onClose}
                className="px-5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-bold"
              >
                Concluir
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
